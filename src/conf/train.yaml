# ---------- Overriding hydra default configs ----------
hydra:
  job:
    name: train
    chdir: true
  run:
    dir: output/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - _self_
  - dir: local

n_epochs: 50
train_batch_size: 4096
valid_batch_size: 4096
scheduler: "ReduceLROnPlateau"
lr: 1e-4
n_accumulates: 1
early_stopping_steps: 10
